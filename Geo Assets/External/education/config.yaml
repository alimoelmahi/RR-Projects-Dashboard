iso3: SDN
category:
  name: education_facilities
  formats:
  - gpkg
  - shp
  - geojson
  - kml
  skip_pcodes: false
  boundary_resolution: null
  hdx:
    title: Education Facilities
    notes: 'Education facilities: schools, kindergartens, colleges, and universities
      tagged via `amenity` or `building`. Useful for school-access mapping, education
      planning, and resource allocation.


      Coverage reflects where volunteer mappers have been active. Urban areas are
      usually well represented, remote areas may be sparse. Cross-check critical decisions
      with local field knowledge.


      - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative
      world map

      - Tags: [amenity](https://wiki.openstreetmap.org/wiki/Key:amenity), [building](https://wiki.openstreetmap.org/wiki/Key:building)

      - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/)
      by [HOT](https://www.hotosm.org/)

      '
    summary: ''
    tags:
    - education facilities-schools
    - geodata
    license: hdx-odc-odbl
    license_url: https://opendatacommons.org/licenses/odbl/1-0/
    caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
    dataset_source: OpenStreetMap contributors
  overture:
    enabled: false
    theme: ''
    feature_type: ''
    select: []
    where: []
    tiles: true
  osm:
    enabled: true
    select:
    - feature_id AS id
    - tags['name'] AS name
    - tags['name:en'] AS name_en
    - tags['amenity'] AS amenity
    - tags['building'] AS building
    - tags['operator:type'] AS operator_type
    - tags['capacity:persons'] AS capacity_persons
    - tags['addr:full'] AS addr_full
    - tags['addr:city'] AS addr_city
    - tags['source'] AS source
    where: []
    filter:
      amenity:
      - kindergarten
      - school
      - college
      - university
      building:
      - kindergarten
      - school
      - college
      - university
    tiles: true
  transliterate:
  - target: name_latin
    source: name
    prefer: name_en
  temporal:
    column: update_time
source: osm
